[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "Thucia"
dynamic = ["version"]
description = "Thucia"
readme = "README.md"
requires-python = ">=3.11"
scripts = { thucia = "thucia:main" }
dependencies = [
    "darts[all]>=0.41.0",
    "docker>=7.1.0",
    "duckdb>=1.4.1",
    "flax>=0.11.0",
    "geopandas>=1.1.0",
    "netcdf4>=1.7.2",
    "openpyxl>=3.1.5",
    "platformdirs>=4.3.8",
    "podman>=5.5.0",
    "pyarrow>=20.0.0",
    "rapidfuzz>=3.13.0",
    "rasterio>=1.4.4",
    "seaborn>=0.13.2",
    "timesfm>=1.3.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "xarray>=2025.6.0",
]

[project.optional-dependencies]
vis = [
    "streamlit>=1.45.1",
    "colorcet>=3.1.0",
    "seaborn>=0.13.2",
]
timesfm = [
    "timesfm[torch]>=1.3.0",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]
chronos = [
    "chronos-forecasting>=2.1.0",
]
all = [
    "streamlit>=1.45.1",
    "colorcet>=3.1.0",
    "seaborn>=0.13.2",
    "timesfm[torch]>=1.3.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[tool.setuptools_scm]

[tool.pytest.ini_options]
markers = [
    "slow: heavy real model fits (run explicitly with `uv run pytest -m slow`)",
    "network: requires a network download (e.g. timesfm checkpoint); excluded from CI",
]
addopts = "-m 'not slow' -p thucia_pytest_bootstrap"
filterwarnings = [
    "ignore:.*'pin_memory'.*:Warning",
    "ignore:.*Non-invertible.*:Warning",
    "ignore:.*Maximum Likelihood optimization failed.*:Warning",
    "ignore:.*treespec.*LeafSpec.*:Warning",
    "ignore:.*stochastic TimeSeries.*:Warning",
    "ignore:.*invalid escape sequence.*:Warning",
    "ignore:.*non-interactive.*:Warning",
    "ignore:.*keep_geom_type.*dropped geometries.*:UserWarning",
    "ignore:.*does not have valid feature names.*:UserWarning",
]
